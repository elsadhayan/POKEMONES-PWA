<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokePWA - Pokedex</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="logo">⚡ PokePWA</div>
        <ul class="nav-links">
            <li><a href="#" onclick="cerrarDetalle()">Inicio</a></li>
        </ul>
    </nav>

    <!-- Vista Principal (Lista) -->
    <div id="vista-lista">
        <h2 class="main-title">Listado de Pokémon</h2>
        <main>
            <section id="pokemon-container" class="grid-container"></section>
        </main>
    </div>

    <!-- Vista de Detalle (Oculta por defecto) -->
    <div id="vista-detalle" class="oculto">
        <nav class="navbar" style="background: #333;">
            <button onclick="cerrarDetalle()" class="btn-volver">⬅ Volver a la Lista</button>
        </nav>
        <h2 class="main-title">Detalle del Pokémon</h2>
        <main>
            <section id="detalle-container" class="detalle-card"></section>
        </main>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./serviceworker.js')
                .then(() => console.log('SW listo'))
                .catch(err => console.log('Error SW:', err));
        }
    </script>
    <script src="js/app.js"></script>
</body>
</html>
